<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Workflow">
  <defs>
    <pattern id="brick" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#e2734b"/>
      <rect x="1" y="1" width="13" height="13" fill="none" stroke="#b6502c" stroke-width="1.4"/>
      <circle cx="7.5" cy="7.5" r="3" fill="#f2a37c"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="26" fill="#141110"/>

  <!-- sparkle accent -->
  <g stroke="#f5ece5" stroke-width="4" stroke-linecap="round">
    <line x1="500" y1="38" x2="500" y2="66"/>
    <line x1="486" y1="52" x2="514" y2="52"/>
    <line x1="490" y1="42" x2="510" y2="62"/>
    <line x1="510" y1="42" x2="490" y2="62"/>
  </g>

  <!-- outer dark outline layer -->
  <g font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="108"
     stroke="#1c130d" stroke-width="20" stroke-linejoin="round" fill="#1c130d">
    <text x="470" y="185" text-anchor="end">The</text>
    <text x="530" y="185" text-anchor="start">Workflow</text>
  </g>

  <!-- inner bevel ring layer -->
  <g font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="108"
     stroke="#a8451f" stroke-width="9" stroke-linejoin="round" fill="#a8451f">
    <text x="470" y="185" text-anchor="end">The</text>
    <text x="530" y="185" text-anchor="start">Workflow</text>
  </g>

  <!-- brick-textured fill layer -->
  <g font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="108"
     fill="url(#brick)">
    <text x="470" y="185" text-anchor="end">The</text>
    <text x="530" y="185" text-anchor="start">Workflow</text>
  </g>

  <!-- accent dot between the words -->
  <circle cx="500" cy="150" r="11" fill="#3b6fe0"/>
  <circle cx="500" cy="150" r="11" fill="none" stroke="#1c130d" stroke-width="3"/>
</svg>
